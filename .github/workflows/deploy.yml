name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          echo "=== Running wrangler pages deploy ==="
          npx wrangler pages deploy dist --project-name=web 2>&1 | tee /tmp/deploy-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          exit $EXIT_CODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show deployment output (on failure)
        if: failure() && steps.deploy.outcome == 'failure'
        run: cat /tmp/deploy-output.txt 2>/dev/null || echo "No output captured"
