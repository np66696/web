<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NASA APOD Explorer</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.nasa.gov https://static.cloudflareinsights.com; frame-src 'self' https://www.youtube.com; font-src 'self';" />
    <style>
        /* ======== RESET & BASE ======== */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{font-size:16px;-webkit-text-size-adjust:100%}
        body{
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            background:#06060e;
            color:#d4d4dc;
            min-height:100vh;
            overflow-x:hidden;
            overscroll-behavior:none;
            -webkit-overflow-scrolling:touch;
        }

        /* ======== COSMIC NEBULA BACKGROUND ======== */
        .cosmos{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 20% 30%, rgba(88,28,135,.12), transparent),
                radial-gradient(ellipse 60% 40% at 75% 20%, rgba(30,64,175,.10), transparent),
                radial-gradient(ellipse 70% 60% at 50% 80%, rgba(6,78,59,.08), transparent),
                radial-gradient(ellipse 50% 30% at 85% 70%, rgba(88,28,135,.06), transparent);
        }
        .cosmos::before{
            content:'';
            position:absolute;inset:0;
            background:
                radial-gradient(1px 1px at 3% 12%, rgba(255,255,255,.95), transparent),
                radial-gradient(1px 1px at 8% 38%, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 11% 6%, rgba(255,255,255,.85), transparent),
                radial-gradient(1.2px 1.2px at 18% 55%, rgba(255,255,255,.9), transparent),
                radial-gradient(1px 1px at 23% 22%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 28% 72%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.3px 1.3px at 34% 14%, rgba(255,255,255,.9), transparent),
                radial-gradient(1px 1px at 39% 48%, rgba(255,255,255,.65), transparent),
                radial-gradient(1px 1px at 43% 82%, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 48% 28%, rgba(255,255,255,.7), transparent),
                radial-gradient(1.2px 1.2px at 53% 66%, rgba(255,255,255,.85), transparent),
                radial-gradient(1px 1px at 58% 10%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 63% 44%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.3px 1.3px at 68% 76%, rgba(255,255,255,.9), transparent),
                radial-gradient(1px 1px at 73% 20%, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 78% 58%, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 82% 34%, rgba(255,255,255,.65), transparent),
                radial-gradient(1.2px 1.2px at 87% 6%, rgba(255,255,255,.85), transparent),
                radial-gradient(1px 1px at 91% 52%, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 94% 70%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.3px 1.3px at 7% 80%, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 15% 92%, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 36% 90%, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.2px 1.2px at 72% 16%, rgba(255,255,255,.85), transparent),
                radial-gradient(1px 1px at 84% 84%, rgba(255,255,255,.65), transparent),
                radial-gradient(1px 1px at 96% 22%, rgba(255,255,255,.7), transparent);
        }

        /* ======== LAYOUT ======== */
        .app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 24px}

        /* ======== HEADER ======== */
        .header{
            text-align:center;padding:56px 16px 40px;
            border-bottom:1px solid rgba(255,255,255,.05);
        }
        .header-icon{font-size:3rem;margin-bottom:12px;display:block}
        .header h1{
            font-size:clamp(1.8rem, 5vw, 3.2rem);
            font-weight:800;
            background:linear-gradient(135deg, #c084fc, #818cf8, #22d3ee);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;
            letter-spacing:-0.03em;
            line-height:1.15;
        }
        .header .subtitle{
            color:#6b7280;font-size:1rem;margin-top:10px;
            letter-spacing:.02em;
        }

        /* ======== LANGUAGE TOGGLE ======== */
        .lang-toggle{
            margin-top:18px;
            display:inline-flex;
            background:rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.1);
            border-radius:999px;
            overflow:hidden;
        }
        .lang-toggle button{
            min-width:48px;min-height:48px;
            padding:10px 20px;
            background:transparent;
            border:none;
            color:#888;
            font-size:.85rem;font-weight:600;
            cursor:pointer;
            transition:background .25s,color .25s;
            font-family:inherit;
        }
        .lang-toggle button.active{
            background:rgba(139,92,246,.25);
            color:#c4b5fd;
        }
        .lang-toggle button:hover{color:#ddd}
        .lang-toggle button:focus-visible{
            outline:2px solid #a78bfa;
            outline-offset:-2px;
        }

        /* ======== GRID ======== */
        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
            gap:20px;
            padding:36px 0 52px;
        }
        @media(max-width:380px){
            .grid{grid-template-columns:1fr;gap:14px;padding:24px 0 36px}
        }

        /* ======== CARD ======== */
        .card{
            background:rgba(15,15,30,.7);
            border:1px solid rgba(255,255,255,.06);
            border-radius:14px;
            overflow:hidden;
            cursor:pointer;
            transition:transform .35s cubic-bezier(.4,0,.2,1),
                       box-shadow .35s,
                       border-color .35s;
            position:relative;
            min-height:48px;
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
        }
        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 16px 48px rgba(139,92,246,.18);
            border-color:rgba(139,92,246,.35);
        }
        .card:focus-visible{
            outline:3px solid #a78bfa;
            outline-offset:5px;
            border-radius:16px;
        }
        .card-image-wrap{
            position:relative;
            width:100%;
            aspect-ratio:16/10;
            overflow:hidden;
            background:rgba(255,255,255,.02);
        }
        .card-image-wrap img{
            width:100%;height:100%;object-fit:cover;
            transition:transform .5s cubic-bezier(.4,0,.2,1);
        }
        .card:hover .card-image-wrap img{transform:scale(1.06)}
        .card-image-wrap::after{
            content:'';
            position:absolute;inset:0;
            background:linear-gradient(transparent 60%, rgba(6,6,14,.7));
            pointer-events:none;
        }
        .card-body{padding:14px 18px 18px}
        .card-body .date{
            font-size:.78rem;color:#555;margin-bottom:6px;
            font-variant-numeric:tabular-nums;
            text-transform:uppercase;letter-spacing:.08em;
        }
        .card-body h3{
            font-size:1.05rem;font-weight:700;color:#e8e8ed;
            margin-bottom:8px;line-height:1.4;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
            overflow:hidden;
        }
        .card-body .excerpt{
            font-size:.83rem;color:#888;line-height:1.6;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
            overflow:hidden;
        }
        .card-hint{
            position:absolute;bottom:10px;right:14px;
            font-size:.68rem;color:rgba(255,255,255,.2);
            text-transform:uppercase;letter-spacing:.06em;
            pointer-events:none;
        }

        /* ======== CAROUSEL SECTION ======== */
        .carousel-section{padding:8px 0 48px}
        .carousel-section .section-title{
            font-size:1.3rem;font-weight:700;color:#a5b4fc;
            margin-bottom:18px;display:flex;align-items:center;gap:8px;
        }
        .carousel-section .section-title .icon{font-size:1.3rem}
        .carousel-wrap{
            position:relative;
            overflow:hidden;
            border-radius:14px;
            background:rgba(15,15,30,.5);
            border:1px solid rgba(255,255,255,.05);
            touch-action:manipulation;
            user-select:none;
            -webkit-user-select:none;
        }
        .carousel-track{
            display:flex;
            transition:transform .45s cubic-bezier(.25,.1,.25,1);
            will-change:transform;
        }
        .carousel-slide{
            flex:0 0 100%;
            position:relative;
            aspect-ratio:21/9;
            min-height:220px;
        }
        .carousel-slide img{
            width:100%;height:100%;object-fit:cover;
            pointer-events:none;
        }
        .carousel-slide-caption{
            position:absolute;bottom:0;left:0;right:0;
            padding:28px 32px;
            background:linear-gradient(transparent, rgba(2,2,14,.92));
            pointer-events:none;
        }
        .carousel-slide-caption h3{font-size:1.15rem;color:#f0f0f5;margin-bottom:4px}
        .carousel-slide-caption .date{font-size:.78rem;color:#888}

        /* Carousel nav buttons — 48x48px touch targets */
        .carousel-btn{
            position:absolute;top:50%;transform:translateY(-50%);
            width:48px;height:48px;
            background:rgba(8,8,20,.65);
            border:1px solid rgba(255,255,255,.12);
            border-radius:50%;
            color:#e0e0e0;font-size:1.2rem;
            cursor:pointer;z-index:5;
            display:flex;align-items:center;justify-content:center;
            transition:background .25s, border-color .25s, transform .25s;
            backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);
        }
        .carousel-btn:hover{
            background:rgba(139,92,246,.3);
            border-color:rgba(139,92,246,.45);
            transform:translateY(-50%) scale(1.08);
        }
        .carousel-btn:focus-visible{
            outline:3px solid #a78bfa;
            outline-offset:4px;
        }
        .carousel-btn.prev{left:14px}
        .carousel-btn.next{right:14px}
        .carousel-dots{
            display:flex;justify-content:center;gap:8px;
            padding:16px 0 0;
        }
        .carousel-dot{
            width:48px;height:48px;
            background:transparent;border:none;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            position:relative;
            border-radius:50%;
        }
        .carousel-dot::after{
            content:'';width:8px;height:8px;
            border-radius:50%;
            background:rgba(255,255,255,.2);
            transition:background .3s, transform .3s, box-shadow .3s;
        }
        .carousel-dot.active::after{
            background:#a78bfa;
            transform:scale(1.6);
            box-shadow:0 0 10px rgba(167,139,250,.5);
        }
        .carousel-dot:focus-visible{
            outline:3px solid #a78bfa;
            outline-offset:3px;
        }

        /* ======== LIGHTBOX ======== */
        .lightbox{
            position:fixed;inset:0;z-index:1000;
            background:rgba(3,3,16,.97);
            display:flex;align-items:center;justify-content:center;
            opacity:0;pointer-events:none;
            transition:opacity .3s ease;
            overscroll-behavior:contain;
        }
        .lightbox.open{opacity:1;pointer-events:auto}
        .lightbox-content{
            width:100%;max-width:1050px;
            max-height:94vh;overflow-y:auto;
            padding:20px;
            display:flex;flex-direction:column;align-items:center;
            overscroll-behavior:contain;
            touch-action:pan-y;
        }
        .lightbox-content img{
            max-width:100%;max-height:62vh;
            object-fit:contain;border-radius:12px;
            box-shadow:0 0 80px rgba(139,92,246,.08);
        }
        .lightbox-info{
            text-align:center;margin-top:22px;
            max-width:680px;
        }
        .lightbox-info h2{font-size:1.5rem;color:#f0f0f0;margin-bottom:8px}
        .lightbox-info .date{color:#777;margin-bottom:16px;font-variant-numeric:tabular-nums}
        .lightbox-info .explanation{
            color:#999;line-height:1.8;font-size:.92rem;
        }
        .lightbox-close{
            position:absolute;top:18px;right:18px;
            width:48px;height:48px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.1);
            border-radius:50%;
            color:#ccc;font-size:1.3rem;
            cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:background .2s,color .2s;
            z-index:10;
        }
        .lightbox-close:hover{background:rgba(255,255,255,.12);color:#fff}
        .lightbox-close:focus-visible{
            outline:3px solid #a78bfa;
            outline-offset:4px;
        }

        /* ======== STATES ======== */
        .loading-state{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:80px 20px;gap:18px;
        }
        /* Ensure hidden attribute overrides display:flex */
        .loading-state[hidden],
        [hidden]{
            display:none !important;
        }
        .spinner{
            width:44px;height:44px;
            border:3px solid rgba(255,255,255,.08);
            border-top-color:#a78bfa;
            border-radius:50%;
            animation:spin .75s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-state p{color:#888;font-size:.95rem}
        .error-state{
            text-align:center;padding:60px 20px;color:#f87171;
        }
        .error-state .err-sub{color:#888;font-size:.88rem;margin-top:6px}
        .error-state button{
            margin-top:18px;padding:14px 36px;
            min-height:48px;min-width:48px;
            background:rgba(139,92,246,.15);
            border:1px solid rgba(139,92,246,.35);
            border-radius:999px;
            color:#c4b5fd;font-size:1rem;cursor:pointer;
            transition:background .25s;
        }
        .error-state button:hover{background:rgba(139,92,246,.3)}
        .error-state button:focus-visible{
            outline:3px solid #a78bfa;
            outline-offset:4px;
        }

        /* ======== KEYBOARD HINTS ======== */
        .kbd-bar{
            text-align:center;padding:6px 0 18px;
            font-size:.72rem;color:rgba(255,255,255,.13);
            letter-spacing:.04em;
        }
        .kbd-bar kbd{
            display:inline-block;min-width:22px;
            padding:2px 7px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
            border-radius:5px;font-family:inherit;font-size:.68rem;
        }

        /* ======== GLOBAL FOCUS ======== */
        :focus:not(:focus-visible){outline:none}
        :focus-visible{outline:2px solid #a78bfa;outline-offset:2px;border-radius:4px}

        /* ======== SCROLLBAR ======== */
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}
    </style>
</head>
<body>

    <!-- Cosmic background -->
    <div class="cosmos" aria-hidden="true"></div>

    <!-- App shell -->
    <div class="app">
        <header class="header">
            <span class="header-icon" aria-hidden="true">🌌</span>
            <h1>Astronomy Picture of the Day</h1>
            <p class="subtitle">Explore the universe — one image at a time</p>
            <div class="lang-toggle" id="lang-toggle" role="radiogroup" aria-label="Language">
                <button data-lang="zh" aria-label="中文">中文</button>
                <button data-lang="en" class="active" aria-label="English">EN</button>
            </div>
        </header>

        <!-- Loading -->
        <div id="loading" class="loading-state" role="status" aria-live="polite">
            <div class="spinner"></div>
            <p>Fetching cosmic wonders…</p>
        </div>

        <!-- Error -->
        <div id="error" class="error-state" hidden>
            <p>⚠️ Failed to load images from NASA</p>
            <p class="err-sub">Please check your connection and try again.</p>
            <button id="retry-btn">🔄 Retry</button>
        </div>

        <!-- Card Grid -->
        <div id="grid" class="grid" hidden></div>

        <!-- Carousel -->
        <section id="carousel-section" class="carousel-section" hidden>
            <h2 class="section-title">
                <span class="icon">🎠</span> Swipe to Explore
            </h2>
            <div class="carousel-wrap" id="carousel-wrap" role="region" aria-label="Image carousel" tabindex="0">
                <div class="carousel-track" id="carousel-track"></div>
                <button class="carousel-btn prev" id="carousel-prev" aria-label="Previous slide">◀</button>
                <button class="carousel-btn next" id="carousel-next" aria-label="Next slide">▶</button>
            </div>
            <div class="carousel-dots" id="carousel-dots"></div>
            <div class="kbd-bar">
                <kbd>←</kbd> <kbd>→</kbd> arrow keys &nbsp;·&nbsp;
                <kbd>Esc</kbd> close lightbox
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image detail view">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close detail view">✕</button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="" />
                <div class="lightbox-info">
                    <h2 id="lightbox-title"></h2>
                    <p class="date" id="lightbox-date"></p>
                    <p class="explanation" id="lightbox-explanation"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function(){
        'use strict';

        /* ========== I18N ========== */
        var lang = localStorage.getItem('nasa-lang') || 'en';

        var i18n = {
            en: {
                title: 'Astronomy Picture of the Day',
                subtitle: 'Explore the universe — one image at a time',
                loading: 'Fetching cosmic wonders…',
                errorTitle: '⚠️ Failed to load images from NASA',
                errorSub: 'Please check your connection and try again.',
                retry: '🔄 Retry',
                carouselTitle: '🎠 Swipe to Explore',
                prevSlide: 'Previous slide',
                nextSlide: 'Next slide',
                goToSlide: 'Go to slide ',
                kbdHint: 'arrow keys · <kbd>Esc</kbd> close lightbox',
                closeDetail: 'Close detail view',
                imageDetail: 'Image detail view',
                cardHint: '🔍 tap to view',
                viewItem: 'View '
            },
            zh: {
                title: 'NASA 每日天文图片',
                subtitle: '探索宇宙 — 每天一张，惊艳一生',
                loading: '正在获取宇宙奇观…',
                errorTitle: '⚠️ 无法从 NASA 加载图片',
                errorSub: '请检查网络连接后重试。',
                retry: '🔄 重试',
                carouselTitle: '🎠 滑动探索',
                prevSlide: '上一张',
                nextSlide: '下一张',
                goToSlide: '跳转到第 ',
                kbdHint: '方向键切换 · <kbd>Esc</kbd> 关闭详情',
                closeDetail: '关闭详情',
                imageDetail: '图片详情',
                cardHint: '🔍 点击查看',
                viewItem: '查看 '
            }
        };

        function t(key){
            return (i18n[lang] && i18n[lang][key]) || (i18n['en'][key] || key);
        }

        function setLang(newLang){
            if(newLang === lang) return;
            lang = newLang;
            localStorage.setItem('nasa-lang', lang);
            updateLanguageUI();
            renderAllText();
        }

        function updateLanguageUI(){
            var btns = document.querySelectorAll('#lang-toggle button');
            btns.forEach(function(b){
                b.classList.toggle('active', b.getAttribute('data-lang') === lang);
            });
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        }

        function renderAllText(){
            // Header
            document.querySelector('.header h1').textContent = t('title');
            document.querySelector('.header .subtitle').textContent = t('subtitle');

            // Loading
            var loadingP = document.querySelector('#loading p');
            if(loadingP) loadingP.textContent = t('loading');

            // Error
            var errP = document.querySelector('#error > p');
            if(errP) errP.textContent = t('errorTitle');
            var errSub = document.querySelector('#error .err-sub');
            if(errSub) errSub.textContent = t('errorSub');
            var retry = document.querySelector('#retry-btn');
            if(retry) retry.textContent = t('retry');

            // Carousel
            var carTitle = document.querySelector('#carousel-section .section-title');
            if(carTitle) carTitle.innerHTML = '<span class="icon">🎠</span> ' + t('carouselTitle');
            var prevB = document.querySelector('#carousel-prev');
            if(prevB) prevB.setAttribute('aria-label', t('prevSlide'));
            var nextB = document.querySelector('#carousel-next');
            if(nextB) nextB.setAttribute('aria-label', t('nextSlide'));
            var kbdB = document.querySelector('.kbd-bar');
            if(kbdB) kbdB.innerHTML = '<kbd>←</kbd> <kbd>→</kbd> ' + t('kbdHint');

            // Close button
            var closeB = document.querySelector('#lightbox-close');
            if(closeB) closeB.setAttribute('aria-label', t('closeDetail'));

            // Lightbox dialog
            var lb = document.querySelector('#lightbox');
            if(lb) lb.setAttribute('aria-label', t('imageDetail'));

            // Cards — update hints & aria-labels
            var cards = document.querySelectorAll('#grid .card');
            cards.forEach(function(card, i){
                var hint = card.querySelector('.card-hint');
                if(hint) hint.textContent = t('cardHint');
                if(apodData[i]){
                    card.setAttribute('aria-label', t('viewItem') + apodData[i].title);
                }
            });

            // Carousel dots
            var dots = document.querySelectorAll('#carousel-dots .carousel-dot');
            dots.forEach(function(dot, i){
                dot.setAttribute('aria-label', t('goToSlide') + (i + 1));
            });
        }
        var loadingEl = document.getElementById('loading');
        var errorEl   = document.getElementById('error');
        var gridEl    = document.getElementById('grid');
        var carouselSection = document.getElementById('carousel-section');
        var carouselTrack   = document.getElementById('carousel-track');
        var carouselWrap    = document.getElementById('carousel-wrap');
        var carouselDots    = document.getElementById('carousel-dots');
        var prevBtn  = document.getElementById('carousel-prev');
        var nextBtn  = document.getElementById('carousel-next');
        var lightbox       = document.getElementById('lightbox');
        var lightboxImg    = document.getElementById('lightbox-img');
        var lightboxTitle  = document.getElementById('lightbox-title');
        var lightboxDate   = document.getElementById('lightbox-date');
        var lightboxExplanation = document.getElementById('lightbox-explanation');
        var lightboxClose  = document.getElementById('lightbox-close');
        var retryBtn = document.getElementById('retry-btn');

        /* ========== STATE ========== */
        var apodData     = [];
        var slideIndex   = 0;
        var swipeActive  = false;
        var swipeStartX  = 0;
        var swipeDelta   = 0;
        var activePointerType = '';

        /* ========== PRELOAD FIRST IMAGES (non-blocking) ========== */
        function preloadFirstImages(data, count){
            count = Math.min(count || 2, data.length);
            for(var i = 0; i < count; i++){
                var src = data[i].hdurl || data[i].url;
                if(/youtube\.com|youtu\.be|vimeo\.com/i.test(src)) continue;
                var link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = src;
                link.fetchpriority = 'high';
                document.head.appendChild(link);
            }
        }

        function fetchData(){
            loadingEl.hidden = false;
            errorEl.hidden   = true;
            gridEl.hidden    = true;
            carouselSection.hidden = true;

            // AbortController 支持超时取消
            var controller = new AbortController();
            var timeoutId = setTimeout(function(){ controller.abort(); }, 15000);

            fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&count=6', {
                signal: controller.signal,
                referrerPolicy: 'no-referrer',
            })
                .then(function(resp){
                    clearTimeout(timeoutId);
                    if(!resp.ok) throw new Error('HTTP ' + resp.status);
                    return resp.json();
                })
                .then(function(data){
                    if(!data || !data.length) throw new Error('Empty response');
                    apodData = data;
                    // 立即渲染（不等图片加载），预加载前 2 张可见图
                    render();
                    preloadFirstImages(apodData, 2);
                })
                .then(function(){
                    render();
                })
                .catch(function(err){
                    clearTimeout(timeoutId);
                    console.error('NASA API error:', err);
                    loadingEl.hidden = true;
                    errorEl.hidden   = false;
                });
        }

        /* ========== RENDER ========== */
        function render(){
            loadingEl.hidden = true;
            gridEl.hidden    = false;
            carouselSection.hidden = false;
            buildGrid();
            buildCarousel();
            renderAllText();
        }

        function buildGrid(){
            gridEl.innerHTML = '';
            apodData.forEach(function(item, i){
                var src = item.hdurl || item.url;
                var card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', t('viewItem') + item.title);
                card.innerHTML =
                    '<div class="card-image-wrap">' +
                        '<img src="' + esc(src) + '" alt="' + esc(item.title) + '" loading="lazy" decoding="async"' + (i < 2 ? ' fetchpriority="high"' : '') + ' />' +
                    '</div>' +
                    '<div class="card-body">' +
                        '<p class="date">' + esc(item.date) + '</p>' +
                        '<h3>' + esc(item.title) + '</h3>' +
                        '<p class="excerpt">' + esc(item.explanation || '') + '</p>' +
                    '</div>' +
                    '<span class="card-hint">' + t('cardHint') + '</span>';

                card.addEventListener('click', function(){ openLightbox(i); });
                card.addEventListener('keydown', function(e){
                    if(e.key === 'Enter' || e.key === ' '){
                        e.preventDefault();
                        openLightbox(i);
                    }
                });
                gridEl.appendChild(card);
            });
        }

        function buildCarousel(){
            carouselTrack.innerHTML = '';
            carouselDots.innerHTML  = '';
            slideIndex = 0;

            apodData.forEach(function(item, i){
                var src = item.hdurl || item.url;
                var slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.setAttribute('draggable', 'false');
                slide.innerHTML =
                    '<img src="' + esc(src) + '" alt="' + esc(item.title) + '" draggable="false" decoding="async" loading="lazy" />' +
                    '<div class="carousel-slide-caption">' +
                        '<h3>' + esc(item.title) + '</h3>' +
                        '<p class="date">' + esc(item.date) + '</p>' +
                    '</div>';
                carouselTrack.appendChild(slide);

                var dot = document.createElement('button');
                dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                dot.setAttribute('aria-label', t('goToSlide') + (i + 1));
                dot.addEventListener('click', (function(idx){
                    return function(){ goTo(idx); };
                })(i));
                carouselDots.appendChild(dot);
            });

            setCarouselPos();
        }

        function setCarouselPos(){
            carouselTrack.style.transform = 'translateX(-' + (slideIndex * 100) + '%)';
            var dots = carouselDots.querySelectorAll('.carousel-dot');
            dots.forEach(function(d, i){ d.classList.toggle('active', i === slideIndex); });
        }

        function goTo(idx){
            slideIndex = ((idx % apodData.length) + apodData.length) % apodData.length;
            setCarouselPos();
        }

        /* ========== POINTER EVENTS (touch/pen swipe) ========== */
        carouselWrap.addEventListener('pointerdown', function(e){
            activePointerType = e.pointerType;
            if(activePointerType !== 'touch' && activePointerType !== 'pen') return;

            e.preventDefault();
            swipeActive = true;
            swipeStartX = e.clientX;
            swipeDelta  = 0;
            carouselTrack.style.transition = 'none';
            carouselWrap.setPointerCapture(e.pointerId);
        });

        carouselWrap.addEventListener('pointermove', function(e){
            if(!swipeActive) return;
            if(activePointerType !== 'touch' && activePointerType !== 'pen') return;

            e.preventDefault();
            swipeDelta = e.clientX - swipeStartX;
            var pct = -slideIndex * 100 + (swipeDelta / carouselWrap.offsetWidth) * 100;
            carouselTrack.style.transform = 'translateX(' + pct + '%)';
        });

        function endSwipe(e){
            if(!swipeActive) return;
            swipeActive = false;

            if(activePointerType === 'touch' || activePointerType === 'pen'){
                if(e) e.preventDefault();
            }

            carouselTrack.style.transition = 'transform .45s cubic-bezier(.25,.1,.25,1)';
            var threshold = carouselWrap.offsetWidth * 0.2;

            if(swipeDelta < -threshold)      goTo(slideIndex + 1);
            else if(swipeDelta > threshold)  goTo(slideIndex - 1);
            else                             setCarouselPos();

            swipeDelta = 0;
            activePointerType = '';
        }

        carouselWrap.addEventListener('pointerup', endSwipe);
        carouselWrap.addEventListener('pointercancel', function(e){
            if(!swipeActive) return;
            swipeActive = false;
            carouselTrack.style.transition = 'transform .45s cubic-bezier(.25,.1,.25,1)';
            setCarouselPos();
            swipeDelta = 0;
            activePointerType = '';
        });

        /* Prevent context menu during touch/pen drag */
        carouselWrap.addEventListener('contextmenu', function(e){
            if(activePointerType === 'touch' || activePointerType === 'pen'){
                e.preventDefault();
            }
        });

        /* ========== BUTTON NAV ========== */
        prevBtn.addEventListener('click', function(){ goTo(slideIndex - 1); });
        nextBtn.addEventListener('click', function(){ goTo(slideIndex + 1); });

        /* ========== KEYBOARD NAV ========== */
        document.addEventListener('keydown', function(e){
            if(e.key === 'Escape'){
                if(lightbox.classList.contains('open')){
                    e.preventDefault();
                    closeLightbox();
                }
                return;
            }
            if(e.key === 'ArrowLeft'){
                if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
                e.preventDefault();
                goTo(slideIndex - 1);
            }
            if(e.key === 'ArrowRight'){
                if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
                e.preventDefault();
                goTo(slideIndex + 1);
            }
        });

        /* ========== LIGHTBOX ========== */
        function openLightbox(idx){
            var item = apodData[idx];
            lightboxImg.src = item.hdurl || item.url;
            lightboxImg.alt = item.title;
            lightboxTitle.textContent = item.title;
            lightboxDate.textContent = item.date;
            lightboxExplanation.textContent = item.explanation || '';
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
            lightboxClose.focus();
        }

        function closeLightbox(){
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
            lightboxImg.src = '';
            if(document.activeElement) document.activeElement.blur();
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e){
            if(e.target === lightbox) closeLightbox();
        });

        /* ========== RETRY ========== */
        retryBtn.addEventListener('click', fetchData);

        /* ========== LANGUAGE TOGGLE ========== */
        document.getElementById('lang-toggle').addEventListener('click', function(e){
            var btn = e.target.closest('button');
            if(!btn) return;
            var newLang = btn.getAttribute('data-lang');
            if(newLang) setLang(newLang);
        });

        /* ========== BLOCK PULL-TO-REFRESH (安全处理) ========== */
        document.addEventListener('touchmove', function(e){
            if(lightbox.classList.contains('open')){
                if(!e.target.closest('.lightbox-content')){
                    e.preventDefault();
                }
            }
        }, { passive: false });

        /* ========== UTILS ========== */
        var escCache = Object.create(null);
        function esc(str){
            if(str == null) return '';
            var s = '' + str;
            if(escCache[s]) return escCache[s];
            // 仅转义 HTML 关键字符，避免创建 DOM 元素的开销
            var result = s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
            escCache[s] = result;
            return result;
        }

        /* ========== INIT ========== */
        updateLanguageUI();
        renderAllText();
        fetchData();
    })();
    </script>
</body>
</html>
