<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA APOD Explorer · 每日天文图片</title>
    <meta name="description" content="NASA 每日天文图片（APOD）探索器 — 每天一张来自 NASA 的宇宙奇观，支持轮播、详情查看与中英双语。" />
    <meta property="og:title" content="NASA APOD Explorer · 每日天文图片" />
    <meta property="og:description" content="探索宇宙 — 每天一张来自 NASA 的惊艳天文图片。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://apod.nasa.gov/apod/calendar/S_240629.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NASA APOD Explorer" />
    <meta name="twitter:description" content="探索宇宙 — 每天一张来自 NASA 的惊艳天文图片。" />
    
    <meta name="theme-color" content="#06060e" />
    <link rel="canonical" href="/nasa.html" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.nasa.gov https://static.cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com; font-src 'self'; object-src 'none'; base-uri 'self';" />
</head>
<body>

    <!-- Cosmic background -->
    <div class="cosmos" aria-hidden="true"></div>

    <!-- App shell -->
    <main class="app">
        <header class="header">
            <a href="/" class="back-btn" title="返回主页">
                <span class="arrow">◂</span> 返回主页
                <span class="star">✦</span>
            </a>
            <span class="header-icon" aria-hidden="true">🌌</span>
            <h1>Astronomy Picture of the Day</h1>
            <p class="subtitle">Explore the universe — one image at a time</p>
            <div class="lang-toggle" id="lang-toggle" role="radiogroup" aria-label="Language">
                <button data-lang="zh" aria-label="中文" role="radio" aria-checked="false">中文</button>
                <button data-lang="en" class="active" aria-label="English" role="radio" aria-checked="true">EN</button>
            </div>
        </header>

        <!-- Loading -->
        <div id="loading" class="loading-state" role="status" aria-live="polite">
            <div class="spinner"></div>
            <p>Fetching cosmic wonders…</p>
        </div>

        <!-- Error -->
        <div id="error" class="error-state" hidden>
            <p>⚠️ Failed to load images from NASA</p>
            <p class="err-sub">Please check your connection and try again.</p>
            <button id="retry-btn">🔄 Retry</button>
        </div>

        <!-- Card Grid -->
        <div id="grid" class="grid" hidden></div>

        <!-- Carousel -->
        <section id="carousel-section" class="carousel-section" hidden>
            <h2 class="section-title">
                <span class="icon">🎠</span> Swipe to Explore
            </h2>
            <div class="carousel-wrap" id="carousel-wrap" role="region" aria-label="Image carousel" tabindex="0">
                <div class="carousel-track" id="carousel-track"></div>
                <button class="carousel-btn prev" id="carousel-prev" aria-label="Previous slide">◀</button>
                <button class="carousel-btn next" id="carousel-next" aria-label="Next slide">▶</button>
            </div>
            <div class="carousel-dots" id="carousel-dots"></div>
            <div class="kbd-bar">
                <kbd>←</kbd> <kbd>→</kbd> arrow keys &nbsp;·&nbsp;
                <kbd>Esc</kbd> close lightbox
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image detail view">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close detail view">✕</button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="" />
                <iframe id="lightbox-video" class="lightbox-video" title="NASA video" hidden
                    allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>
                <div class="lightbox-info">
                    <h2 id="lightbox-title"></h2>
                    <p class="date" id="lightbox-date"></p>
                    <p class="explanation" id="lightbox-explanation"></p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/scripts/nasa.ts"></script>
</body>
</html>
