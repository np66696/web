name = "animated-website"
type = "webpack"
account_id = "your-account-id"
workers_dev = true
compatibility_date = "2024-01-01"

[site]
bucket = "./dist"
entry-point = "workers"

[env.production]
zone_id = "your-zone-id"
routes = [
    "https://animated.example.com/*"
]

[vars]
ANIMATION_INTENSITY = "medium"
ENABLE_WEBGL = "true"

[[migrations]]
tag = "v1"
new_classes = ["AnimationState"]