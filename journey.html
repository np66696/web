<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>群星 · Stellaris</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.nasa.gov https://apod.nasa.gov https://www.youtube.com; connect-src 'self' https://api.nasa.gov https://static.cloudflareinsights.com; frame-src 'self' https://www.youtube.com; font-src 'self';" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
</head>
<body class="bg-[#020510] text-white overflow-hidden h-screen">
    <!-- WebGL 星空背景 -->
    <div id="webgl-container" class="fixed inset-0 z-0"></div>
    <!-- 星云光晕叠加层 -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-30" style="background: radial-gradient(ellipse at 50% 0%, rgba(88,28,135,0.4) 0%, transparent 50%), radial-gradient(ellipse at 20% 80%, rgba(30,64,175,0.3) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(147,51,234,0.2) 0%, transparent 50%);"></div>

    <!-- 主内容区 -->
    <main class="relative z-10">
        <!-- 返回主页按钮 -->
        <a href="/" class="fixed top-6 left-6 z-50 group flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium tracking-wide transition-all duration-300 shadow-lg shadow-indigo-500/25 hover:shadow-indigo-400/40 no-underline" title="返回主页">
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <span>返回主页</span>
        </a>

        <!-- 首屏 Hero -->
        <section id="hero" class="min-h-screen flex flex-col items-center justify-center text-center px-4 pointer-events-none">
            <!-- 装饰性星座连线 -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
                <svg class="w-full h-full" viewBox="0 0 1200 800" preserveAspectRatio="none">
                    <line x1="100" y1="200" x2="350" y2="150" stroke="#6366f1" stroke-width="0.5" />
                    <line x1="350" y1="150" x2="500" y2="300" stroke="#6366f1" stroke-width="0.5" />
                    <line x1="500" y1="300" x2="700" y2="180" stroke="#6366f1" stroke-width="0.5" />
                    <line x1="700" y1="180" x2="900" y2="350" stroke="#6366f1" stroke-width="0.5" />
                    <line x1="900" y1="350" x2="1100" y2="220" stroke="#6366f1" stroke-width="0.5" />
                    <line x1="200" y1="500" x2="450" y2="420" stroke="#8b5cf6" stroke-width="0.5" />
                    <line x1="450" y1="420" x2="600" y2="600" stroke="#8b5cf6" stroke-width="0.5" />
                    <line x1="600" y1="600" x2="850" y2="480" stroke="#8b5cf6" stroke-width="0.5" />
                    <circle cx="100" cy="200" r="2" fill="#6366f1" />
                    <circle cx="350" cy="150" r="2" fill="#818cf8" />
                    <circle cx="500" cy="300" r="2" fill="#6366f1" />
                    <circle cx="700" cy="180" r="2" fill="#a78bfa" />
                    <circle cx="900" cy="350" r="2" fill="#818cf8" />
                    <circle cx="1100" cy="220" r="2" fill="#6366f1" />
                    <circle cx="200" cy="500" r="2" fill="#8b5cf6" />
                    <circle cx="450" cy="420" r="2" fill="#a78bfa" />
                    <circle cx="600" cy="600" r="2" fill="#8b5cf6" />
                    <circle cx="850" cy="480" r="2" fill="#c4b5fd" />
                </svg>
            </div>

            <div class="relative z-10 pointer-events-auto">
                <div class="inline-block px-4 py-1.5 mb-8 rounded-full border border-indigo-500/30 bg-indigo-950/40 backdrop-blur-sm text-indigo-300 text-sm tracking-widest uppercase">
                    ✦ 征服星河 ✦
                </div>
                <h1 class="text-5xl md:text-7xl lg:text-8xl font-bold mb-6 tracking-tight" style="background: linear-gradient(135deg, #e0e7ff 0%, #818cf8 25%, #a78bfa 50%, #6366f1 75%, #c4b5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    群星 · Stellaris
                </h1>
                <p class="text-lg md:text-xl text-indigo-200/70 mb-10 max-w-xl mx-auto leading-relaxed">
                    在这片浩瀚银河中<br/>书写属于你的星际帝国传奇
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="https://qunxing.huijiwiki.com/" target="_blank" rel="noopener"
                       class="group relative px-8 py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-full font-semibold transition-all duration-500 overflow-hidden shadow-lg shadow-indigo-500/25 hover:shadow-indigo-400/50 no-underline">
                        <span class="relative z-10 flex items-center gap-2 text-white">
                            📖 群星 WIKI
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500 animate-shimmer bg-[length:200%_100%]"></div>
                    </a>
                    <a href="https://store.steampowered.com/app/281990/Stellaris/" target="_blank" rel="noopener"
                       class="group relative px-8 py-3.5 rounded-full font-semibold transition-all duration-500 overflow-hidden border border-indigo-400/30 bg-indigo-950/30 backdrop-blur-sm hover:border-indigo-400/60 hover:bg-indigo-900/40 no-underline">
                        <span class="relative z-10 flex items-center gap-2 text-indigo-200 group-hover:text-white transition-colors">
                            🛒 Steam 商店
                        </span>
                    </a>
                </div>
            </div>

            <!-- 滚动指示器 -->
            <div class="absolute bottom-10 flex flex-col items-center gap-2 animate-float">
                <span class="text-xs text-indigo-400/60 tracking-widest uppercase">向下滚动</span>
                <svg class="w-6 h-6 text-indigo-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </section>

        <!-- Footer -->
        <footer class="relative py-16 text-center">
            <div class="absolute inset-0 bg-gradient-to-t from-[#020510] via-[#020510]/80 to-transparent pointer-events-none"></div>
            <div class="relative z-10 space-y-3">
                <p class="text-indigo-300/40 text-sm">🌌 群星导航站 · Stellaris Guide · Cloudflare</p>
                <p class="text-indigo-300/25 text-xs">银河在上，愿群星指引你的道路</p>
            </div>
        </footer>
    </main>

    <!-- 跃迁过渡层（返回首页时使用） -->
    <div id="cosmic-transition" style="display:none;">
        <div class="transition-warp-ring"></div>
        <div class="transition-particle-field"></div>
        <div class="transition-core"></div>
        <div class="transition-spark-trail"></div>
    </div>

    <script type="module" src="/src/scripts/journey.ts"></script>
</body>
</html>
