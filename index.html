<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>非线性动画演示</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
</head>
<body class="bg-gray-950 text-white overflow-x-hidden">
    <!-- WebGL 背景 -->
    <div id="webgl-container" class="fixed inset-0 z-0"></div>

    <!-- 主内容区 -->
    <main class="relative z-10">
        <!-- 首屏 Hero -->
        <section id="hero" class="min-h-screen flex flex-col items-center justify-center text-center px-4">
            <h1 id="hero-title" class="text-5xl md:text-7xl font-bold mb-6 bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 bg-clip-text text-transparent">
                非线性动画
            </h1>
            <p id="hero-subtitle" class="text-xl md:text-2xl text-gray-300 mb-8 max-w-2xl">
                由 GSAP + Three.js 驱动的弹性、回弹、缓动动画系统
            </p>
            <div id="hero-cta" class="flex gap-4">
                <button id="btn-primary" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-full font-semibold transition-colors duration-300">
                    开始探索
                </button>
                <button id="btn-secondary" class="px-8 py-3 border border-gray-500 hover:border-white rounded-full font-semibold transition-all duration-300">
                    了解更多
                </button>
            </div>
            <div id="scroll-indicator" class="absolute bottom-10 animate-bounce">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </section>

        <!-- 弹性动画演示区 -->
        <section id="elastic-demo" class="min-h-screen flex flex-col items-center justify-center px-4 py-20">
            <h2 class="text-4xl font-bold mb-16">🎯 弹性缓动动画</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl w-full">
                <div class="card bg-gray-900/80 backdrop-blur rounded-2xl p-8 border border-gray-800 hover:border-blue-500/50 transition-colors">
                    <div class="card-icon text-5xl mb-4">🎪</div>
                    <h3 class="text-xl font-bold mb-2">Elastic Out</h3>
                    <p class="text-gray-400">弹性缓出，到达目标后回弹振荡</p>
                </div>
                <div class="card bg-gray-900/80 backdrop-blur rounded-2xl p-8 border border-gray-800 hover:border-purple-500/50 transition-colors">
                    <div class="card-icon text-5xl mb-4">🎾</div>
                    <h3 class="text-xl font-bold mb-2">Bounce</h3>
                    <p class="text-gray-400">模拟物理弹跳，重力逐渐衰减</p>
                </div>
                <div class="card bg-gray-900/80 backdrop-blur rounded-2xl p-8 border border-gray-800 hover:border-pink-500/50 transition-colors">
                    <div class="card-icon text-5xl mb-4">↩️</div>
                    <h3 class="text-xl font-bold mb-2">Back</h3>
                    <p class="text-gray-400">过冲后退，产生回拉效果</p>
                </div>
            </div>
        </section>

        <!-- 非线性滚动展示区 -->
        <section id="scroll-demo" class="min-h-screen flex flex-col items-center justify-center px-4 py-20">
            <h2 class="text-4xl font-bold mb-16">📜 非线性滚动动画</h2>
            <div class="parallax-layer space-y-32 max-w-4xl w-full">
                <div class="scroll-item flex items-center gap-8">
                    <div class="scroll-visual w-32 h-32 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex-shrink-0"></div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">视差滚动</h3>
                        <p class="text-gray-400">不同元素以不同速率滚动，创造深度感</p>
                    </div>
                </div>
                <div class="scroll-item flex items-center gap-8 flex-row-reverse text-right">
                    <div class="scroll-visual w-32 h-32 bg-gradient-to-br from-purple-500 to-pink-600 rounded-full flex-shrink-0"></div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">交错入场</h3>
                        <p class="text-gray-400">元素以非线性间隔依次出现，制造节奏感</p>
                    </div>
                </div>
                <div class="scroll-item flex items-center gap-8">
                    <div class="scroll-visual w-32 h-32 bg-gradient-to-br from-pink-500 to-orange-500 rounded-2xl flex-shrink-0 rotate-45"></div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">缩放渐变</h3>
                        <p class="text-gray-400">滚动过程中元素非线性缩放与透明度变化</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 交互演示区 -->
        <section id="interactive-demo" class="min-h-screen flex flex-col items-center justify-center px-4 py-20">
            <h2 class="text-4xl font-bold mb-16">🎮 交互式非线性动画</h2>
            <div class="flex flex-wrap gap-8 justify-center max-w-3xl">
                <div id="magnetic-btn" class="magnetic group relative w-40 h-40 bg-gray-800 rounded-3xl flex items-center justify-center cursor-pointer border border-gray-700 hover:border-blue-400 transition-colors">
                    <span class="text-4xl group-hover:scale-125 transition-transform">🧲</span>
                </div>
                <div id="spring-ball" class="w-40 h-40 bg-gradient-to-br from-green-400 to-blue-500 rounded-full flex items-center justify-center cursor-pointer shadow-lg shadow-blue-500/25">
                    <span class="text-4xl">🏀</span>
                </div>
                <div id="inertia-scroll" class="w-40 h-40 bg-gray-800 rounded-3xl flex items-center justify-center cursor-pointer border border-gray-700 overflow-hidden">
                    <div class="inertia-content text-center p-4">
                        <span class="text-4xl block mb-2">🎠</span>
                        <span class="text-sm text-gray-400">惯性滚动</span>
                    </div>
                </div>
            </div>
        </section>

        <footer class="py-12 text-center text-gray-500">
            <p>非线性动画系统 · GSAP + Three.js + TypeScript · Cloudflare 部署</p>
        </footer>
    </main>

    <script type="module" src="/src/scripts/main.ts"></script>
</body>
</html>
